name: Docs

on:
  push:
    branches: [main]
  # Lets a docs-only fix be redeployed without an empty commit.
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time, and never cancel one midway: a half-published
# Pages deploy would leave the site inconsistent.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The reference is generated from dist/index.d.ts, so the build must run
      # first. This is what keeps the docs from drifting away from the code.
      - run: npm run build
      - run: npm run docs:build

      # Fails the job if the committed api.json is stale, so a pull request
      # that changes the public surface cannot merge with outdated docs.
      - name: Check generated docs are current
        run: |
          if ! git diff --quiet -- docs/assets/api.json docs/llms.txt docs/llms-full.txt docs/md; then
            echo "::error::Generated docs are out of date. Run 'npm run docs:build' and commit the result."
            git diff --stat -- docs/assets/api.json docs/llms.txt docs/llms-full.txt docs/md
            exit 1
          fi

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
