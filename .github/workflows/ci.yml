name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. Jobs opt into more only where they need it.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Third-party actions are pinned to a commit SHA rather than a tag: a tag
      # is a movable pointer, and the 2025 tj-actions compromise moved dozens of
      # published tags onto one malicious commit in a single day.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run check:publish
      - run: npm run check:exports

  runtimes:
    name: runtime smoke (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run build

      # Proves the published entry points resolve under both module systems on
      # every supported Node major.
      - name: import as ESM
        run: node -e "import('./dist/index.js').then(m => { if (!m.TeslaClient) process.exit(1) })"
      - name: require as CJS
        run: node -e "if (!require('./dist/index.cjs').TeslaClient) process.exit(1)"

  examples:
    name: examples typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # The examples resolve the SDK through the workspace link, so a breaking
      # change to the public surface fails here before it reaches a release.
      - name: typecheck every example
        run: |
          for dir in examples/*/; do
            echo "==> ${dir}"
            npm --prefix "${dir}" run typecheck
          done
