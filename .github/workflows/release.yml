name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      # Opening and updating the version pull request, and pushing tags.
      contents: write
      pull-requests: write
      # Mints the OIDC token that npm trusted publishing exchanges for a
      # short-lived credential, and that signs the provenance attestation.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          # Points npm at the public registry without writing an auth line.
          # Authentication comes from the OIDC exchange below, so no
          # NODE_AUTH_TOKEN is set and no long-lived token exists to steal.
          registry-url: https://registry.npmjs.org

      # Trusted publishing requires npm 11.5.1 or later, and Node 22 ships an
      # older npm. Pinned to the 11.x line rather than latest: npm 12 changed
      # the `npm pack --json` shape, which the attw check in `verify` cannot
      # parse yet.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1

      - run: npm ci
      - run: npm run verify

      # Authentication needs no configured secret. npm publishing uses the OIDC
      # exchange, and the action's github-token defaults to the ephemeral,
      # repo-scoped token GitHub mints for this run.
      - uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          publish-script: npm run release
          pr-title: 'chore: release'
          commit-message: 'chore: release'
